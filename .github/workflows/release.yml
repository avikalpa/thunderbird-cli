name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (for example: 3.0.0 or v3.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goarch: amd64
            target: linux_x86_64
          - runner: ubuntu-24.04-arm
            goarch: arm64
            target: linux_arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          version_input='${{ github.event.inputs.version || '' }}'
          if [ -n "$version_input" ]; then
            tag="${version_input#v}"
          else
            tag="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$tag" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'

      - name: Install NSS development packages
        run: sudo apt-get update && sudo apt-get install -y libnss3-dev libnspr4-dev

      - name: Build archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/stage
          export CGO_ENABLED=1
          export GOOS=linux
          export GOARCH='${{ matrix.goarch }}'
          ldflags="-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA::7} -X main.builtAt=${BUILD_TIME}"
          go build -trimpath -ldflags "$ldflags" -o dist/stage/tb ./...
          cp README.md LICENSE LICENSE-CC-BY-SA-4.0 dist/stage/
          tar -C dist/stage -czf "dist/thunderbird-cli_${VERSION}_${{ matrix.target }}.tar.gz" tb README.md LICENSE LICENSE-CC-BY-SA-4.0

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/thunderbird-cli_${{ env.VERSION }}_${{ matrix.target }}.tar.gz

  build-portable:
    name: Build portable ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            target: darwin_x86_64
            ext: ''
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            target: darwin_arm64
            ext: ''
            archive: tar.gz
          - goos: windows
            goarch: amd64
            target: windows_x86_64
            ext: '.exe'
            archive: zip
          - goos: windows
            goarch: arm64
            target: windows_arm64
            ext: '.exe'
            archive: zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          version_input='${{ github.event.inputs.version || '' }}'
          if [ -n "$version_input" ]; then
            tag="${version_input#v}"
          else
            tag="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$tag" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'

      - name: Build archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/stage
          export CGO_ENABLED=0
          export GOOS='${{ matrix.goos }}'
          export GOARCH='${{ matrix.goarch }}'
          ldflags="-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA::7} -X main.builtAt=${BUILD_TIME}"
          go build -trimpath -ldflags "$ldflags" -o "dist/stage/tb${{ matrix.ext }}" ./...
          cp README.md LICENSE LICENSE-CC-BY-SA-4.0 dist/stage/
          if [ '${{ matrix.archive }}' = 'tar.gz' ]; then
            tar -C dist/stage -czf "dist/thunderbird-cli_${VERSION}_${{ matrix.target }}.tar.gz" "tb${{ matrix.ext }}" README.md LICENSE LICENSE-CC-BY-SA-4.0
          else
            (cd dist/stage && zip -q "../thunderbird-cli_${VERSION}_${{ matrix.target }}.zip" "tb${{ matrix.ext }}" README.md LICENSE LICENSE-CC-BY-SA-4.0)
          fi

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/thunderbird-cli_${{ env.VERSION }}_${{ matrix.target }}.*

  release:
    name: Publish release
    needs:
      - build-linux
      - build-portable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          version_input='${{ github.event.inputs.version || '' }}'
          if [ -n "$version_input" ]; then
            tag="${version_input#v}"
          else
            tag="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$tag" >> "$GITHUB_ENV"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum thunderbird-cli_* > SHA256SUMS.txt

      - name: Generate curated release notes
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/release-notes.sh "$VERSION" > dist/RELEASE_NOTES.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          body_path: dist/RELEASE_NOTES.md
          draft: false
          prerelease: false
